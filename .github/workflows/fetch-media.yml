# Copies the images from the old WordPress site into the repository.
# Run it from the GitHub "Actions" tab → "Fetch WordPress media" → "Run workflow".
name: Fetch WordPress media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download images
        run: node scripts/fetch-media.mjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wp-content
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git commit -m "Add images from the old WordPress site"
            git push
          fi
